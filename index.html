<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f2e9">
  <title>START-UP DNA</title>
  <style>
    :root{--paper:#f6f2e9;--surface:#fffdf8;--ink:#182326;--muted:#617073;--line:#d9d8cf;--brand:#5d47d6;--brand-soft:#e9e4ff;--yellow:#ffd85a;--shadow:0 18px 50px rgba(32,38,39,.10);--radius:28px}
    *{box-sizing:border-box} html{background:var(--paper)} body{margin:0;min-height:100svh;color:var(--ink);background:radial-gradient(circle at 8% 6%,rgba(255,216,90,.25),transparent 26rem),var(--paper);font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;word-break:keep-all}
    button{font:inherit} button:focus-visible{outline:3px solid #181818;outline-offset:3px}.hidden{display:none!important}
    .app{width:min(100%,760px);margin:auto;padding:max(18px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom))}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 2px 16px}.brand{font-weight:900;letter-spacing:-.04em}.org{font-size:.72rem;color:var(--muted);text-align:right}
    .panel{background:var(--surface);border:1px solid rgba(24,35,38,.09);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
    .screen{padding:clamp(24px,6vw,48px)}
    .hero-tag,.eyebrow{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;background:var(--brand-soft);color:#4431ad;font-weight:800;font-size:.78rem;letter-spacing:.02em}
    h1,h2,h3,p{margin-top:0}h1{font-size:clamp(2.4rem,10vw,5rem);line-height:.95;letter-spacing:-.075em;margin:22px 0 20px;max-width:650px}h1 span{display:block;color:var(--brand)}
    .lead{font-size:clamp(1.15rem,3.6vw,1.45rem);line-height:1.55;font-weight:750;letter-spacing:-.035em;margin-bottom:12px}.sub{color:var(--muted);line-height:1.65;margin-bottom:30px}
    .hero-art{height:180px;margin:4px -10px 28px;position:relative}.orb{position:absolute;border:3px solid var(--ink);border-radius:50%;background:var(--yellow)}.orb.one{width:120px;height:120px;left:50%;top:18px;transform:translateX(-50%)}.orb.two{width:52px;height:52px;left:19%;top:90px;background:#6ccbb8}.orb.three{width:68px;height:68px;right:13%;top:24px;background:#ff8b62}.spark{position:absolute;font-size:2.5rem;font-weight:900}.spark.s1{left:10%;top:10px;color:var(--brand)}.spark.s2{right:34%;bottom:4px;color:#09806b}.hero-line{position:absolute;width:170px;height:60px;border-top:3px solid var(--ink);border-radius:50%;left:50%;top:130px;transform:translateX(-50%) rotate(-5deg)}
    .primary,.secondary,.ghost{min-height:54px;border-radius:16px;border:0;padding:14px 18px;font-weight:850;cursor:pointer;transition:transform .16s,background .16s}.primary{width:100%;background:var(--ink);color:#fff;box-shadow:0 8px 0 #5d47d6}.primary:hover{transform:translateY(-2px)}.primary:disabled{background:#adb5b3;box-shadow:none;cursor:not-allowed;transform:none}.secondary{background:var(--brand-soft);color:#3e2ca0}.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
    .fine{font-size:.74rem;line-height:1.55;color:#788386;text-align:center;margin:20px auto 0;max-width:500px}
    .progress-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:10px}.count{font-weight:900;color:var(--brand)}.progress-track{height:8px;background:#e3e2da;border-radius:99px;overflow:hidden;margin-bottom:34px}.progress-bar{height:100%;width:12.5%;background:var(--brand);border-radius:99px;transition:width .25s ease}
    .question{font-size:clamp(1.55rem,5.5vw,2.25rem);line-height:1.33;letter-spacing:-.045em;margin-bottom:26px}.answers{display:grid;gap:12px}.answer{width:100%;min-height:62px;border:2px solid var(--line);background:#fff;border-radius:17px;padding:15px 18px;text-align:left;color:var(--ink);font-weight:700;line-height:1.45;cursor:pointer;transition:border .15s,transform .15s,background .15s}.answer:hover{border-color:#9e96d8;transform:translateY(-1px)}.answer[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand)}
    .nav{display:grid;grid-template-columns:1fr 1.7fr;gap:10px;margin-top:28px}
    .result-head{text-align:center;padding-bottom:28px}.result-head h2{font-size:clamp(2rem,8vw,3.5rem);letter-spacing:-.065em;margin:15px 0 12px}.result-head p{color:var(--muted);line-height:1.55;margin:0}.result-stack{display:grid;gap:18px}.result-card{--accent:#5d47d6;--soft:#e9e4ff;border:2px solid var(--ink);border-radius:25px;overflow:hidden;background:#fff}.result-top{padding:24px;background:var(--soft);display:grid;grid-template-columns:1fr 100px;gap:14px;align-items:center}.type-label{font-size:.75rem;font-weight:900;color:var(--accent);letter-spacing:.08em}.result-title{font-size:clamp(1.65rem,6vw,2.35rem);letter-spacing:-.055em;margin:7px 0 8px}.quote{font-size:.95rem;font-weight:760;line-height:1.5;margin:0}.character{width:100px;height:100px;color:var(--accent)}.result-body{padding:22px 24px;display:grid;gap:16px}.fact{display:grid;grid-template-columns:68px 1fr;gap:12px}.fact b{font-size:.76rem;color:var(--accent);padding-top:2px}.fact p{margin:0;line-height:1.55;color:#3f4b4e;font-size:.92rem}
    .match-founder{margin-top:2px;padding:17px 18px;border-radius:18px;background:var(--soft);border:1px dashed var(--accent)}.match-kicker{display:block;margin-bottom:5px;color:var(--accent);font-size:.72rem;font-weight:900;letter-spacing:.06em}.match-founder h4{margin:0 0 7px;font-size:1.03rem}.match-founder p{margin:0;color:#3f4b4e;font-size:.86rem;line-height:1.58}.match-founder a{display:inline-block;margin-top:9px;color:var(--accent);font-size:.78rem;font-weight:850;text-underline-offset:3px}.match-note{margin-top:9px!important;color:var(--muted)!important;font-size:.7rem!important}
    .founders{margin-top:22px;padding:24px;border-radius:22px;background:#f0eee7}.did-you-know{display:inline-block;margin-bottom:7px;color:#5d47d6;font-size:.73rem;font-weight:950;letter-spacing:.08em}.founders h3{font-size:1.25rem;margin-bottom:8px}.founders>p{color:var(--muted);font-size:.86rem;line-height:1.6;margin-bottom:16px}.founder-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}.founder-list span{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 12px;font-size:.8rem;font-weight:900}.founder-list small{display:block;margin-top:2px;color:var(--muted);font-size:.68rem;font-weight:650}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.actions .primary{box-shadow:none}.restart{grid-column:1/-1}.toast{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:999px;font-size:.84rem;font-weight:750;opacity:0;pointer-events:none;transition:.2s;z-index:10;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:430px){.app{padding-left:12px;padding-right:12px}.screen{padding:24px 19px}.org{display:none}.hero-art{height:150px}.orb.one{width:104px;height:104px}.result-top{grid-template-columns:1fr 80px;padding:20px}.character{width:80px;height:80px}.fact{grid-template-columns:60px 1fr}.actions{grid-template-columns:1fr}.restart{grid-column:auto}}
    @media(min-width:760px){.panel{min-height:650px;display:flex;align-items:center}.screen{width:100%}.hero-layout{display:grid;grid-template-columns:1.25fr .75fr;gap:30px;align-items:center}.hero-art{order:2;margin:0}.hero-copy{order:1}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
  </style>
</head>
<body>
<main class="app">
  <header class="topbar"><div class="brand">START-UP DNA</div><div class="org">경상국립대학교<br>창업중심대학사업단</div></header>
  <div class="panel">
    <section id="start" class="screen" aria-labelledby="start-title">
      <div class="hero-layout"><div class="hero-art" aria-hidden="true"><div class="spark s1">✦</div><div class="orb two"></div><div class="orb one"></div><div class="orb three"></div><div class="hero-line"></div><div class="spark s2">+</div></div><div class="hero-copy"><span class="hero-tag">8개의 질문 · 약 2분</span><h1 id="start-title">친구들과 창업하면,<span>나는 무슨 역할일까?</span></h1><p class="lead">정답 없는 상황 속에서 나의 창업 캐릭터를 발견해보세요.</p><p class="sub">떠올리고, 만들어보고, 관찰하고, 연결하는 방식 중 나에게 가장 자연스러운 시작은 무엇일까요?</p><button id="start-btn" class="primary" type="button">테스트 시작하기</button><p class="fine">재미로 살펴보는 자기탐색 콘텐츠이며, 심리검사나 창업 역량 평가가 아닙니다.</p></div></div>
    </section>
    <section id="quiz" class="screen hidden" aria-labelledby="question-title">
      <div class="progress-head"><span class="eyebrow">MY START-UP DNA</span><span id="count" class="count">1 / 8</span></div><div class="progress-track" role="progressbar" aria-label="진행률" aria-valuemin="1" aria-valuemax="8" aria-valuenow="1"><div id="progress" class="progress-bar"></div></div>
      <h2 id="question-title" class="question" tabindex="-1"></h2><div id="answers" class="answers" role="group" aria-labelledby="question-title"></div>
      <div class="nav"><button id="back" class="ghost" type="button">이전</button><button id="next" class="primary" type="button" disabled>다음 질문</button></div>
    </section>
    <section id="result" class="screen hidden" aria-labelledby="result-title"><div id="result-content"></div><div class="actions"><button id="save" class="secondary" type="button">결과 카드 저장</button><button id="share" class="primary" type="button">결과 공유</button><button id="restart" class="ghost restart" type="button">처음부터 다시 하기</button></div></section>
  </div>
</main><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const questions=[
['친구들과 하루짜리 팝업 가게를 열기로 했습니다. 내가 먼저 꺼내는 말은?',[['다른 곳에는 없는 콘셉트부터 정해보자.','A'],['샘플 하나 만들어서 반응부터 보자.','B'],['누가 올지, 무엇을 원하는지 알아보자.','C'],['같이하면 좋을 사람들부터 모아보자.','D']]],
['행사 부스 앞을 사람들이 그냥 지나갑니다. 가장 먼저 해볼 일은?',[['눈길을 끌 새로운 체험 방식을 제안한다.','A'],['안내 문구 하나를 바꿔 반응을 비교한다.','B'],['지나가는 사람에게 관심이 안 가는 이유를 묻는다.','C'],['주변 부스에 공동 이벤트를 제안한다.','D']]],
['팀에 새로운 아이디어가 필요합니다. 내가 시작하는 방식은?',[['서로 다른 아이디어를 엮어 새롭게 상상한다.','A'],['간단한 모형을 만들며 생각을 구체화한다.','B'],['사람들이 불편해하는 장면을 찾아본다.','C'],['다른 경험을 가진 사람들을 모아 이야기를 듣는다.','D']]],
['준비한 서비스에 예상과 다른 반응이 나왔습니다. 나는?',[['기존 콘셉트 말고 다른 접근을 떠올린다.','A'],['한 가지씩 바꾸면서 차이를 확인한다.','B'],['이용자가 어떤 점에서 막혔는지 물어본다.','C'],['관련 경험이 있는 사람에게 협업을 제안한다.','D']]],
['예상보다 준비 시간이 부족합니다. 내가 먼저 맡고 싶은 일은?',[['핵심 매력을 살릴 새로운 대안을 찾는다.','A'],['오늘 시험할 수 있는 최소 버전을 만든다.','B'],['이용자에게 꼭 필요한 부분을 확인한다.','C'],['도움받을 사람과 가능한 역할을 정리한다.','D']]],
['일상에서 좋은 아이디어가 떠올랐습니다. 그다음 나는?',[['다른 상황에도 쓸 수 있을지 상상을 확장한다.','A'],['손에 있는 도구로 바로 시험해본다.','B'],['같은 불편을 겪는 사람이 있는지 알아본다.','C'],['함께 발전시킬 사람에게 연락한다.','D']]],
['첫 시도를 끝낸 뒤, 다음 회의에서 내가 꺼내고 싶은 이야기는?',[['다음에는 어떤 새로운 경험을 만들까?','A'],['해본 것 중 무엇을 바꿔 다시 시험할까?','B'],['참여한 사람은 실제로 무엇을 느꼈을까?','C'],['다음에는 누구와 함께하면 좋을까?','D']]],
['팀이 다음 프로젝트를 시작합니다. 가장 먼저 손이 가는 일은?',[['가능성 있는 콘셉트를 여러 개 스케치하기.','A'],['빠르게 시험할 첫 작업 목록 만들기.','B'],['대상자의 상황과 불편을 질문으로 정리하기.','C'],['필요한 역할과 연결할 사람 정리하기.','D']]]];
const types={
A:{name:'상상하는 개척가',quote:'“근데, 이렇게 하면 더 재밌지 않을까?”',strength:'새로운 방식과 대안을 제안하며 가능성을 넓힙니다.',watch:'아이디어를 넓히다 첫 실행을 놓칠 수 있어요.',action:'아이디어 하나를 한 문장으로 적어보세요.',accent:'#694fd8',soft:'#ece7ff',founder:'이병철',company:'삼성 창업주',story:'미래 핵심산업의 가능성을 내다보고 73세에 반도체 개발을 결심한 도전과 연결해볼 수 있어요.',source:'https://www.fki-emuseum.or.kr/main/businessman/LeeByungchul.do'},
B:{name:'일단 해보는 실험가',quote:'“말 나온 김에 한번 만들어보자.”',strength:'작게 시도하고 반응을 보며 답을 찾아갑니다.',watch:'속도에 집중하다 누구를 위한 것인지 놓칠 수 있어요.',action:'종이에 시제품을 그려 한 사람에게 보여주세요.',accent:'#d65f28',soft:'#ffe9dc',founder:'조홍제',company:'효성 창업주',story:'56세에 독자 사업을 시작해 부실기업을 되살리고 기간산업을 키운 꾸준한 실행과 연결해볼 수 있어요.',source:'https://www.fki-emuseum.or.kr/main/businessman/ChoHongje.do'},
C:{name:'불편함을 찾는 탐정',quote:'“사람들은 왜 여기서 불편해하지?”',strength:'관찰과 질문을 통해 진짜 문제를 발견합니다.',watch:'더 알아보느라 시작이 늦어질 수 있어요.',action:'불편한 경험을 한 사람에게 구체적으로 물어보세요.',accent:'#087c6a',soft:'#dff5ef',founder:'구인회',company:'LG 창업주',story:'국민 생활에 필요한 화장품·치약·라디오 등을 국산화한 생활 밀착형 도전과 연결해볼 수 있어요.',source:'https://www.fki-emuseum.or.kr/main/businessman/KooInhoe.do'},
D:{name:'사람을 모으는 연결가',quote:'“이거 잘하는 사람, 내가 아는데!”',strength:'사람과 자원을 연결해 협업을 시작합니다.',watch:'의견을 모으다 결정이 늦어질 수 있어요.',action:'함께할 사람과 역할 하나를 정해보세요.',accent:'#2462bd',soft:'#e2edff',founder:'허만정',company:'LG 공동창업자·GS 시조',story:'구인회의 사업 역량을 알아보고 투자와 공동경영으로 오랜 동행을 만든 협력과 연결해볼 수 있어요.',source:'https://www.fki-emuseum.or.kr/main/businessman/HuhManjung.do'}};
const $=s=>document.querySelector(s), screens={start:$('#start'),quiz:$('#quiz'),result:$('#result')};let index=0,answers=Array(questions.length).fill(null),orders=[];
function shuffled(items){const a=items.map(x=>[...x]);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function show(name){Object.entries(screens).forEach(([k,v])=>v.classList.toggle('hidden',k!==name));window.scrollTo(0,0)}
function start(){index=0;answers=Array(questions.length).fill(null);orders=questions.map(q=>shuffled(q[1]));show('quiz');renderQuestion()}
function renderQuestion(){const [q]=questions[index];$('#count').textContent=`${index+1} / ${questions.length}`;const pct=(index+1)/questions.length*100;$('#progress').style.width=pct+'%';const track=$('.progress-track');track.setAttribute('aria-valuenow',String(index+1));$('#question-title').textContent=q;const wrap=$('#answers');wrap.innerHTML='';orders[index].forEach(([text,type])=>{const b=document.createElement('button');b.type='button';b.className='answer';b.dataset.type=type;b.textContent=text;b.setAttribute('aria-pressed',String(answers[index]===type));b.onclick=()=>{answers[index]=type;renderQuestion()};wrap.appendChild(b)});$('#back').disabled=index===0;$('#next').disabled=!answers[index];$('#next').textContent=index===questions.length-1?'결과 보기':'다음 질문';$('#question-title').focus()}
function score(){const out={A:0,B:0,C:0,D:0};answers.forEach(v=>{if(v)out[v]++});return out}
function winners(){const s=score(),max=Math.max(...Object.values(s));return Object.keys(s).filter(k=>s[k]===max)}
function icon(t){const c=types[t].accent;if(t==='A')return `<svg class="character" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="38" fill="white" stroke="${c}" stroke-width="4"/><path d="M50 20v18M50 62v18M20 50h18M62 50h18M29 29l13 13M58 58l13 13M71 29L58 42M42 58L29 71" stroke="${c}" stroke-width="5" stroke-linecap="round"/></svg>`;if(t==='B')return `<svg class="character" viewBox="0 0 100 100" aria-hidden="true"><rect x="17" y="49" width="28" height="28" rx="5" fill="white" stroke="${c}" stroke-width="4"/><rect x="54" y="26" width="28" height="51" rx="5" fill="white" stroke="${c}" stroke-width="4"/><path d="M31 49V36h37M62 18l7 8-7 8" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;if(t==='C')return `<svg class="character" viewBox="0 0 100 100" aria-hidden="true"><circle cx="43" cy="42" r="24" fill="white" stroke="${c}" stroke-width="5"/><path d="M60 60l23 23" stroke="${c}" stroke-width="7" stroke-linecap="round"/><circle cx="35" cy="36" r="4" fill="${c}"/><path d="M34 51c6 4 13 3 17-2" fill="none" stroke="${c}" stroke-width="4" stroke-linecap="round"/></svg>`;return `<svg class="character" viewBox="0 0 100 100" aria-hidden="true"><circle cx="28" cy="50" r="15" fill="white" stroke="${c}" stroke-width="4"/><circle cx="72" cy="28" r="15" fill="white" stroke="${c}" stroke-width="4"/><circle cx="72" cy="72" r="15" fill="white" stroke="${c}" stroke-width="4"/><path d="M42 44l16-9M42 57l16 9" stroke="${c}" stroke-width="5" stroke-linecap="round"/></svg>`}
function resultCard(t){const d=types[t];return `<article class="result-card" style="--accent:${d.accent};--soft:${d.soft}"><div class="result-top"><div><span class="type-label">START-UP CHARACTER ${t}</span><h3 class="result-title">${d.name}</h3><p class="quote">${d.quote}</p></div>${icon(t)}</div><div class="result-body"><div class="fact"><b>강점</b><p>${d.strength}</p></div><div class="fact"><b>주의점</b><p>${d.watch}</p></div><div class="fact"><b>오늘의 한 걸음</b><p>${d.action}</p></div><div class="match-founder"><span class="match-kicker">이 DNA와 연결해보는 창업가</span><h4>${d.founder} · ${d.company}</h4><p>${d.story}</p><a href="${d.source}" target="_blank" rel="noopener noreferrer">기업가 이야기 확인하기 ↗</a><p class="match-note">같은 성격이라는 뜻이 아니라, 공개된 창업 사례와 유형의 핵심 행동을 연결한 재미 요소입니다.</p></div></div></article>`}
function showResult(){const ws=winners(),multi=ws.length>1;$('#result-content').innerHTML=`<div class="result-head"><span class="eyebrow">MY START-UP DNA</span><h2 id="result-title">${multi?'여러 DNA를 함께 가진 복합형':'나의 창업 캐릭터'}</h2><p>${multi?'상황에 따라 여러 방식으로 시작하는 경향이 나타났어요.':'답변에서 가장 자주 나타난 시작 방식을 보여드려요.'}</p></div><div class="result-stack">${ws.map(resultCard).join('')}</div><aside class="founders"><span class="did-you-know">알고 계셨나요?</span><h3>진주와 인연 깊은 창업가들</h3><p>진주 지수는 이들의 출생·수학·교류와 연결된 K-기업가정신의 거점으로 소개되고 있습니다.</p><div class="founder-list"><span>이병철<small>삼성 창업주</small></span><span>조홍제<small>효성 창업주</small></span><span>구인회<small>LG 창업주</small></span><span>허만정<small>LG 공동창업자·GS 시조</small></span></div></aside>`;show('result');$('#result-title').setAttribute('tabindex','-1');$('#result-title').focus()}
function summary(){const ws=winners();return `나의 START-UP DNA: ${ws.map(t=>types[t].name).join(' × ')}\n연결 창업가: ${ws.map(t=>types[t].founder).join(' × ')}\n${ws.map(t=>types[t].quote).join(' / ')}\n경상국립대학교 창업중심대학사업단`}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2200)}
async function share(){const text=summary();try{if(navigator.share){await navigator.share({title:'나의 START-UP DNA',text});return}if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);toast('결과를 복사했습니다.');return}throw new Error('copy unavailable')}catch(e){if(e&&e.name==='AbortError')return;window.prompt('아래 결과를 길게 눌러 복사하세요.',text)}}
function wrapText(ctx,text,max){const chars=[...text],lines=[];let line='';chars.forEach(ch=>{if(ctx.measureText(line+ch).width>max&&line){lines.push(line);line=ch}else line+=ch});if(line)lines.push(line);return lines}
function drawLines(ctx,text,x,y,max,lineHeight){const lines=wrapText(ctx,text,max);lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lineHeight));return y+lines.length*lineHeight}
function saveCard(){try{const ws=winners(),W=1080,pad=84,cardH=ws.length===1?630:470,H=360+cardH*ws.length+330,canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;const c=canvas.getContext('2d');c.fillStyle='#f6f2e9';c.fillRect(0,0,W,H);c.fillStyle='#182326';c.font='900 44px system-ui,sans-serif';c.fillText('START-UP DNA',pad,92);c.fillStyle='#5d47d6';c.font='900 68px system-ui,sans-serif';c.fillText(ws.length>1?'나의 복합 창업 캐릭터':'나의 창업 캐릭터',pad,190);c.fillStyle='#617073';c.font='500 28px system-ui,sans-serif';c.fillText('정답보다 나다운 시작 방식을 발견합니다.',pad,245);let y=310;ws.forEach(t=>{const d=types[t];c.fillStyle=d.soft;c.strokeStyle='#182326';c.lineWidth=5;c.beginPath();c.roundRect(pad,y,W-pad*2,cardH-28,36);c.fill();c.stroke();c.fillStyle=d.accent;c.font='900 25px system-ui,sans-serif';c.fillText(`START-UP CHARACTER ${t}`,pad+48,y+68);c.fillStyle='#182326';c.font='900 52px system-ui,sans-serif';c.fillText(d.name,pad+48,y+140);c.font='700 28px system-ui,sans-serif';let yy=drawLines(c,d.quote,pad+48,y+195,W-pad*2-96,40);c.font='600 25px system-ui,sans-serif';c.fillStyle='#3f4b4e';yy+=24;yy=drawLines(c,'강점  '+d.strength,pad+48,yy,W-pad*2-96,38);yy+=16;yy=drawLines(c,'오늘  '+d.action,pad+48,yy,W-pad*2-96,38);yy+=20;c.fillStyle=d.accent;c.font='800 25px system-ui,sans-serif';drawLines(c,`연결 창업가  ${d.founder} · ${d.company}`,pad+48,yy,W-pad*2-96,38);y+=cardH});c.fillStyle='#182326';c.font='800 27px system-ui,sans-serif';c.fillText('알고 계셨나요? 진주와 인연 깊은 창업가들',pad,H-215);c.fillStyle='#617073';c.font='600 23px system-ui,sans-serif';drawLines(c,'이병철 · 조홍제 · 구인회 · 허만정 — 진주 지수와 연결된 기업가정신 이야기를 만나보세요.',pad,H-165,W-pad*2,34);c.font='500 22px system-ui,sans-serif';c.fillText('경상국립대학교 창업중심대학사업단',pad,H-72);const a=document.createElement('a');a.download='start-up-dna-result.png';a.href=canvas.toDataURL('image/png');a.click();toast('결과 카드를 저장했습니다.')}catch(e){console.error(e);toast('저장하지 못했습니다. 화면을 캡처해 주세요.')}}
$('#start-btn').onclick=start;$('#back').onclick=()=>{if(index>0){index--;renderQuestion()}};$('#next').onclick=()=>{if(!answers[index])return;if(index<questions.length-1){index++;renderQuestion()}else showResult()};$('#restart').onclick=start;$('#share').onclick=share;$('#save').onclick=saveCard;
window.__STARTUP_DNA_TEST__={questions,types,score,winners,start,getAnswers:()=>[...answers],setAnswers:a=>{answers=[...a]}};
</script>
